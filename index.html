<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sûu Finance</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sûu">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Identidade SÛU: preto e prata, búfalo ao fundo */
:root{
  --bg:#0a0a0a; --surface:rgba(24,24,24,.78); --sunk:#1f1f1f; --line:#2c2c2c;
  --fg:#ededed; --muted:#9b9b9b; --accent:#c8c8c8; --accent-fg:#0a0a0a; --accent-soft:#262626;
  --good:#6fd39a; --warn:#f2b04b; --bad:#ff8a80; --bad-soft:#3a1c1a;
  --display:"Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wm{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(96vw,580px);opacity:.13;pointer-events:none;z-index:0}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:1}
h1{font-size:30px} h2{font-size:23px}
h3{font-size:15px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.who{font-size:13px;color:var(--muted)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .hint{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--sunk);color:var(--fg);font-weight:600;touch-action:manipulation}
button.primary{background:var(--accent);color:var(--accent-fg)}
button.ghost{background:transparent;padding:6px 8px;color:var(--muted);font-weight:500}
button.danger{background:var(--bad-soft);color:var(--bad)}
button.full{width:100%}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:20px;height:20px;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;padding:7px 10px;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.money{font-weight:700;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)} .warn{color:var(--warn)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .v{font-size:17px;font-weight:700;margin-top:2px}
.kpi.full{grid-column:1/-1}
.list{display:flex;flex-direction:column}
.day{font-size:12px;color:var(--muted);font-weight:600;padding:12px 0 4px}
.tx{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;width:100%;background:none;border-radius:0;text-align:left;font-weight:400;color:var(--fg)}
.tx .d{min-width:0}
.tx .t{font-weight:600;overflow-wrap:anywhere}
.tx .s{font-size:12.5px;color:var(--muted)}
.tx.pago{opacity:.55}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8d8d8d,#e2e2e2);border-radius:99px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.linha{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.linha.forte{font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 0 2px}
.sem{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--accent-soft)}
.sem.warn{background:color-mix(in srgb,var(--warn) 18%,transparent)} .sem.bad{background:var(--bad-soft)}
.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{text-transform:capitalize;text-align:center}
.monthnav button{width:42px;height:42px;font-size:20px;padding:0}
details.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
details.blk>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font-weight:600}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary .nm::before{content:"›";display:inline-block;margin-right:8px;color:var(--muted);transition:transform .15s}
details.blk[open]>summary .nm::before{transform:rotate(90deg)}
details.blk[open]>summary{margin-bottom:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#141414;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.tabs button{background:none;border-radius:0;padding:10px 0 12px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.sheet{position:fixed;inset:0;background:rgb(0 0 0 / .6);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet .box{background:var(--bg);border:1px solid var(--line);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:92vh;overflow:auto}
.entrada{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.entrada img{width:180px;margin:0 auto;opacity:.9}
</style>
</head>

/* ================= CONFIGURAÇÃO ================= */

const db = initializeFirestore(fb, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

/* ================= AJUDANTES ================= */
const $ = s => document.querySelector(s);
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const fmt = v => BRL.format(Math.round((+v || 0) * 100) / 100);
const r2 = v => Math.round((+v || 0) * 100) / 100;
const soma = a => r2(a.reduce((x, y) => x + (+y || 0), 0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const ymOf = iso => String(iso).slice(0, 7);
const addMonths = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; };
const dimes = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
const ymLabel = ym => `${MESES[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const mesNome = ym => MESES[+ym.slice(5, 7) - 1];
const dm = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : "";
const novoId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-5);
const capital = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
const limpa = o => JSON.parse(JSON.stringify(o));
function lerValor(s) { s = String(s || "").replace(/r\$\s*/i, "").trim(); if (!s) return 0; if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ""); return r2(parseFloat(s) || 0); }
const valorTxt = v => v ? String(r2(v).toFixed(2)).replace(".", ",") : "";
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function falha(e) { console.error(e); toast("Não salvou: " + (e.code || e.message)); }

/* ================= CICLO 25 → 24 ================= */
// a partir de novembro/2026 o mês vai do dia 25 ao dia 24 (novembro = 25/10 a 24/11)
const CICLO_INI = "2026-10-25";
const usaCiclo = ym => ym >= "2026-11";
const ciclo = iso => (iso >= CICLO_INI && +iso.slice(8, 10) >= 25) ? addMonths(ymOf(iso), 1) : ymOf(iso);
const cicloRange = ym => usaCiclo(ym) ? [`${addMonths(ym, -1)}-25`, `${ym}-24`] : [`${ym}-01`, `${ym}-${pad(dimes(ym))}`];
const cicloLabel = ym => { const [a, b] = cicloRange(ym); return `${dm(a)} a ${dm(b)}`; };

/* ================= ESTADO ================= */
const S = { user: null, eu: null, cfg: null, cfgOk: false, mov: [], meses: {}, meu: { docs: {}, gastos: [] }, mes: ciclo(today()), tab: "lancar", form: null, meuDraft: {}, erroLogin: null, pend: false };
let desligar = [];

const forma = id => (S.cfg?.formas || []).find(f => f.id === id) || { id, nome: id || "—", tipo: "dinheiro" };
const ehCredito = id => forma(id).tipo === "credito";
const pagouQuem = m => forma(m.pagoCom).dono || m.quemPagou || "Camila";   // Flash = dinheiro da Camila
function competencia(iso, pagoCom) {
  const f = forma(pagoCom);
  if (f.tipo !== "credito" || !f.fecha || !f.vence) return ciclo(iso);
  const dia = +iso.slice(8, 10), F = +f.fecha, V = +f.vence, ym = ymOf(iso);
  const fecha = dia < F ? ym : addMonths(ym, 1);
  return V > F ? fecha : addMonths(fecha, 1);   // a compra conta no mês em que a fatura vence
}
const vencFatura = (ym, f) => `${ym}-${pad(Math.min(+f.vence || 1, dimes(ym)))}`;
function vencFixa(ym, dia) { dia = +dia || 1; if (usaCiclo(ym) && dia >= 25) { const a = addMonths(ym, -1); return `${a}-${pad(Math.min(dia, dimes(a)))}`; } return `${ym}-${pad(Math.min(dia, dimes(ym)))}`; }

/* ================= CÁLCULOS (tudo sai da tabela de lançamentos) ================= */
const gastosMes = ym => S.mov.filter(m => m.tipo === "gasto" && m.mes === ym);
function fixasMes(ym) {
  const ini = S.cfg.inicio || "";
  return (S.cfg.categorias || []).filter(c => c.tipo === "Fixa" && c.dia && (!c.desde || c.desde <= ym) && (!c.ate || c.ate >= ym) && ym >= ini)
    .map(c => ({ c, venc: vencFixa(ym, c.dia), pago: S.mov.find(m => m.fixa === c.id && m.fixaMes === ym) }))
    .sort((a, b) => a.venc.localeCompare(b.venc));
}
function faturasMes(ym) {
  return (S.cfg.formas || []).filter(f => f.tipo === "credito").map(f => {
    const itens = gastosMes(ym).filter(m => m.pagoCom === f.id), total = soma(itens.map(m => m.valor));
    const st = S.meses[ym]?.faturas?.[f.id] || null;
    const valor = st && st.valor != null ? +st.valor : total;
    return { f, itens, total, valor, venc: vencFatura(ym, f), st, pago: !!(st && st.pago) };
  });
}
const pendentesFixas = ym => fixasMes(ym).filter(x => !x.pago);
function totalMes(ym) {
  const fats = faturasMes(ym);
  return r2(soma(gastosMes(ym).map(m => m.valor)) - soma(fats.map(x => x.total)) + soma(fats.map(x => x.valor)) + soma(pendentesFixas(ym).map(x => x.c.valor)));
}
function entradasMes(ym) {
  const ov = S.meses[ym]?.entradas || {};

/* ---------- RESUMO ---------- */
function vResumo() {
  const ym = S.mes, ent = entradasMes(ym), ac = acerto(ym), total = ac.total, rec = ac.rec, folga = r2(ent.total + rec - total);
  const fats = faturasMes(ym), lim = +S.cfg.limite || 3000;
  const pctIdeal = ent.total ? total / ent.total * 100 : 0;
  const porCat = {}; gastosMes(ym).forEach(m => porCat[m.categoria] = (porCat[m.categoria] || 0) + m.valor);
  pendentesFixas(ym).forEach(x => porCat[x.c.nome] = (porCat[x.c.nome] || 0) + (+x.c.valor || 0));
  fats.forEach(x => { if (Math.abs(x.valor - x.total) > 0.5) porCat["Fatura sem detalhe"] = (porCat["Fatura sem detalhe"] || 0) + (x.valor - x.total); });
  const cats = Object.entries(porCat).filter(([, v]) => Math.abs(v) > 0.005).sort((a, b) => b[1] - a[1]), maxCat = cats.length ? cats[0][1] : 1;
  const porQuem = {}; gastosMes(ym).forEach(m => porQuem[m.deQuem || "Casa"] = (porQuem[m.deQuem || "Casa"] || 0) + m.valor);
  pendentesFixas(ym).forEach(x => porQuem.Casa = (porQuem.Casa || 0) + (+x.c.valor || 0));
  const hoje = today(), ate = (() => { const d = new Date(); d.setDate(d.getDate() + 10); return isoDate(d); })();
  const prox = [...fixasMes(ym).filter(x => !x.pago).map(x => ({ n: x.c.nome, d: x.venc, v: x.c.valor })), ...fats.filter(x => !x.pago && x.valor > 0).map(x => ({ n: "Fatura " + x.f.nome, d: x.venc, v: x.valor }))]
    .filter(x => x.d <= ate).sort((a, b) => a.d.localeCompare(b.d));
  const meses = []; for (let k = 5; k >= 0; k--) meses.push(addMonths(ym, -k));
  const hist = meses.map(m => ({ m, e: entradasMes(m).total, g: totalMes(m) })), maxH = Math.max(1, ...hist.map(x => Math.max(x.e, x.g)));
  return `<div class="stack">${monthNav()}
    ${fats.map(x => { const pct = x.valor / lim * 100; return `<div class="panel"><div class="row between"><h3>${esc(x.f.nome)} · fatura de ${mesNome(ym)}</h3>${x.pago ? `<span class="pos">Paga</span>` : `<span class="hint">vence ${dm(x.venc)}</span>`}</div>
      <div class="row between" style="margin:8px 0 6px"><span class="money">${fmt(x.valor)}</span><span class="hint">de ${fmt(lim)}</span></div>${barra(pct, pct > 100 ? "bad" : pct > 85 ? "warn" : "")}
      ${pct > 100 ? `<p class="hint neg" style="margin-top:6px">Passou ${fmt(x.valor - lim)} do combinado.</p>` : ""}</div>`; }).join("")}
    <div class="panel"><h3>Balanço do mês</h3>
      ${linha("Entradas", fmt(ent.total))}${rec ? linha("Vão devolver", "+ " + fmt(rec)) : ""}${linha("Total do mês", "− " + fmt(total))}${linha("Folga", `<span class="${folga < 0 ? "neg" : "pos"}">${fmt(folga)}</span>`, true)}
      <div style="margin-top:8px">${barra(pctIdeal, pctIdeal > 100 ? "bad" : pctIdeal > 90 ? "warn" : "")}</div>
      <p class="hint" style="margin-top:6px">Gasto ideal: até ${fmt(ent.total)} (as entradas). Usado ${Math.round(pctIdeal)}%.</p>
      <details style="margin-top:8px"><summary class="hint">Entradas deste mês</summary>
        <div class="stack" style="margin-top:8px">${ent.fixas.map(e => `<div class="row between"><span>${esc(e.nome)}</span><input data-ent="${esc(e.id)}" inputmode="decimal" value="${valorTxt(e.valorMes)}" style="width:110px;text-align:right"></div>`).join("")}
        ${ent.extras.map(m => linha(esc(m.desc || "Entrada") + " · " + esc(m.quemRecebeu), fmt(m.valor))).join("")}
        <button data-a="salvar-entradas">Salvar entradas de ${mesNome(ym)}</button></div></details></div>
    <div class="panel"><h3>Acerto do mês</h3>
      ${linha("Total do mês", fmt(total))}${linha("Menos dinheiro da casa", "− " + fmt(ac.casa))}${rec ? linha("Menos o que vão devolver", "− " + fmt(rec)) : ""}
      ${linha("Parte de cada um", fmt(ac.parte), true)}
      <div class="grp">${esc(ac.outro)}</div>${linha("Pagou do bolso", fmt(ac.pg[ac.outro]))}
      <div class="grp">${esc(ac.casaCom)} (fica com o dinheiro da casa)</div>${linha("Pagou", fmt(ac.pg[ac.casaCom]))}${linha("Usou do dinheiro da casa", fmt(ac.usoCasa))}
      ${ac.aberto > 0.5 ? linha("Ainda falta pagar", fmt(ac.aberto)) : ""}
      <div class="sem ${ac.cls}" style="margin-top:8px">${ac.txt}</div></div>
    <details class="blk"><summary><span class="nm">Despesas por</span><span class="money">${fmt(total)}</span></summary>
      ${DEQUEM.filter(q => porQuem[q]).map(q => linha(q, fmt(porQuem[q]))).join("") || `<p class="hint">Nada ainda.</p>`}</details>
    <details class="blk" open><summary><span class="nm">Próximos vencimentos</span><span class="hint">10 dias</span></summary>
      ${prox.length ? prox.map(x => linha(`${dm(x.d)} · ${esc(x.n)}${x.d < hoje ? " <span class='neg'>(atrasada)</span>" : ""}`, fmt(x.v))).join("") : `<p class="hint">Nada vencendo nos próximos dias.</p>`}</details>
    <details class="blk"><summary><span class="nm">Gasto por categoria</span><span class="money">${fmt(total)}</span></summary>
      ${cats.map(([c, v]) => `<div style="padding:6px 0">${linha(esc(c), fmt(v))}${barra(v / maxCat * 100)}</div>`).join("") || `<p class="hint">Nada ainda.</p>`}</details>
    <details class="blk"><summary><span class="nm">Últimos meses</span><span class="hint">entradas × gasto</span></summary>
      ${hist.map(x => `<div style="padding:6px 0"><div class="row between"><span style="text-transform:capitalize">${mesNome(x.m)}</span><span class="hint">${fmt(x.g)} de ${fmt(x.e)}</span></div>
        <div class="bar" style="margin-top:4px"><i class="${x.g > x.e ? "bad" : ""}" style="width:${x.g / maxH * 100}%"></i></div></div>`).join("")}</details>
  </div>`;
}

}

      <textarea id="imp" rows="4" placeholder="Cole aqui os dados copiados do Sûu"></textarea><button class="primary" data-a="importar">Importar</button></div>` : ""}
    ${tipos.map(t => `<details class="blk" ${t === "Fixa" ? "open" : ""}><summary><span class="nm">${t === "Fixa" ? "Contas fixas" : t === "Recorrente" ? "Recorrentes" : "Esporádicas"}</span><span class="hint">${cats(t).length}</span></summary>
      <p class="hint" style="margin-bottom:6px">${t === "Fixa" ? "Aparecem em Contas todo mês, no dia do vencimento." : t === "Recorrente" ? "Gastos de todo mês sem dia certo (mercado, gasolina…). Só servem de sugestão e para o Resumo." : "Sugestões para lançar. Qualquer nome novo também vale."}</p>
      <div class="list">${cats(t).map(x => `<button class="tx" data-a="cat-editar" data-v="${esc(x.id)}"><span class="d"><span class="t">${esc(x.nome)}</span>${t === "Fixa" ? `<br><span class="s">dia ${x.dia || "—"} · ${fmt(x.valor)} · ${esc(forma(x.pagoCom).nome)}${x.ate ? " · até " + mesNome(x.ate) + "/" + x.ate.slice(2, 4) : ""}</span>` : ""}</span><span class="muted">›</span></button>`).join("")}</div>
      <button class="full" style="margin-top:10px" data-a="cat-nova" data-v="${t}">+ ${t === "Fixa" ? "Nova conta fixa" : "Nova"}</button></details>`).join("")}
    <details class="blk"><summary><span class="nm">Cartões e formas de pagamento</span></summary>
      <div class="list">${(c.formas || []).map(f => `<button class="tx" data-a="forma-editar" data-v="${esc(f.id)}"><span class="d"><span class="t">${esc(f.nome)}</span><br><span class="s">${f.tipo === "credito" ? `cartão · fecha dia ${f.fecha || "—"}, vence dia ${f.vence || "—"}` : f.dono ? `conta como dinheiro da ${esc(f.dono)}` : "pagamento na hora"}</span></span><span class="muted">›</span></button>`).join("")}</div>
      <button class="full" style="margin-top:10px" data-a="forma-editar" data-v="">+ Nova forma</button></details>
    <details class="blk"><summary><span class="nm">Entradas fixas</span><span class="money">${fmt(soma((c.entradas || []).map(e => e.valor)))}</span></summary>
      <div class="list">${(c.entradas || []).map(e => `<button class="tx" data-a="ent-editar" data-v="${esc(e.id)}"><span class="d"><span class="t">${esc(e.nome)}</span><br><span class="s">${e.casa ? "dinheiro da casa · fica com " + esc(c.casaCom || "Kaike") : "de " + esc(e.quem)}</span></span><span class="money">${fmt(e.valor)}</span></button>`).join("")}</div>
      <button class="full" style="margin-top:10px" data-a="ent-editar" data-v="">+ Nova entrada fixa</button></details>
    <details class="blk"><summary><span class="nm">Geral</span></summary><div class="stack">
      <div class="field"><span class="lbl">Contas fixas aparecem a partir de</span><select id="g-ini"><option value="">Desde sempre</option>${ms.map(m => `<option value="${m}" ${m === c.inicio ? "selected" : ""}>${ymLabel(m)}</option>`).join("")}</select></div>
      <div class="grid2"><div class="field"><span class="lbl">Limite por cartão (R$)</span><input id="g-lim" inputmode="decimal" value="${valorTxt(c.limite || 3000)}"></div>
      <div class="field"><span class="lbl">Dinheiro da casa fica com</span><select id="g-casa">${QUEM.map(q => `<option ${q === (c.casaCom || "Kaike") ? "selected" : ""}>${q}</option>`).join("")}</select></div></div>
      <button class="primary" data-a="geral-salvar">Salvar</button></div></details>
    ${S.cfgOk ? `<details class="blk"><summary><span class="nm">Importar do Sûu de novo</span></summary><p class="hint">Use só para trazer a sua aba Meu (cada um importa a própria). Os dados da casa não são substituídos.</p>
      <textarea id="imp" rows="3" placeholder="Cole aqui os dados copiados do Sûu" style="margin-top:8px"></textarea><button class="full" style="margin-top:8px" data-a="importar">Importar só a minha aba Meu</button></details>` : ""}
    <div class="panel row between"><span class="hint">${esc(S.user.email)}</span><button data-a="sair">Sair</button></div></div>`;
}
function editarCategoria(id, tipo) {
  const c = id ? { ...(S.cfg.categorias || []).find(x => x.id === id) } : { id: "", nome: "", tipo, dia: "", valor: "", pagoCom: "boleto", ate: "" };
  const fixa = c.tipo === "Fixa", sh = $("#sheet"); sh.hidden = false;
  const ms = []; for (let i = 0; i <= 36; i++) ms.push(addMonths(ciclo(today()), i));
  sh.innerHTML = `<div class="box stack"><h2>${id ? "Editar" : "Nova"} ${fixa ? "conta fixa" : "categoria"}</h2>
    <div class="field"><span class="lbl">Nome</span><input id="cn" value="${esc(c.nome)}" placeholder="Ex.: Convênio Camila"></div>
    <div class="field"><span class="lbl">Tipo</span><select id="ct">${["Fixa", "Recorrente", "Esporádica"].map(t => `<option ${t === c.tipo ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <div id="cfx" class="stack" ${fixa ? "" : "hidden"}><div class="grid2"><div class="field"><span class="lbl">Dia do vencimento</span><input id="cd" type="number" min="1" max="31" inputmode="numeric" value="${esc(c.dia || "")}"></div>
      <div class="field"><span class="lbl">Valor previsto (R$)</span><input id="cv" inputmode="decimal" value="${valorTxt(c.valor)}"></div></div>
      <div class="grid2"><div class="field"><span class="lbl">Paga com</span><select id="cp">${(S.cfg.formas || []).map(f => `<option value="${f.id}" ${f.id === c.pagoCom ? "selected" : ""}>${esc(f.nome)}</option>`).join("")}</select></div>
      <div class="field"><span class="lbl">Termina em (parcelada)</span><select id="ca"><option value="">Não termina</option>${ms.map(m => `<option value="${m}" ${m === c.ate ? "selected" : ""}>${ymLabel(m)}</option>`).join("")}</select></div></div></div>
    <div class="row">${id ? `<button class="danger" id="cx">Excluir</button>` : ""}<button data-x>Cancelar</button><button class="primary" style="flex:1" id="cok">Salvar</button></div></div>`;
  const fechar = () => { sh.hidden = true; sh.innerHTML = ""; render(); };
  sh.querySelector("[data-x]").onclick = fechar; sh.onclick = e => { if (e.target === sh) fechar(); };
  sh.querySelector("#ct").onchange = e => sh.querySelector("#cfx").hidden = e.target.value !== "Fixa";
  const del = sh.querySelector("#cx");
  if (del) del.onclick = () => { if (!del.dataset.ok) { del.dataset.ok = 1; del.textContent = "Toque de novo"; return; } S.cfg.categorias = S.cfg.categorias.filter(x => x.id !== id); salvarCfg(); toast("Excluída. Os lançamentos antigos continuam."); fechar(); };
  sh.querySelector("#cok").onclick = () => {
    const nome = sh.querySelector("#cn").value.trim(); if (!nome) return toast("Dê um nome");
    const t = sh.querySelector("#ct").value, d = { id: c.id || novoId(), nome: capital(nome), tipo: t };
    if (t === "Fixa") { d.dia = Math.min(31, Math.max(1, +sh.querySelector("#cd").value || 0)) || null; if (!d.dia) return toast("Diga o dia do vencimento"); d.valor = lerValor(sh.querySelector("#cv").value); d.pagoCom = sh.querySelector("#cp").value; d.ate = sh.querySelector("#ca").value || ""; d.desde = c.desde || ""; }
    S.cfg.categorias = [...(S.cfg.categorias || []).filter(x => x.id !== d.id), d]; salvarCfg(); toast("Salvo"); fechar();
  };
}
function editarForma(id) {
  const f = id ? { ...S.cfg.formas.find(x => x.id === id) } : { id: "", nome: "", tipo: "dinheiro" }, sh = $("#sheet"); sh.hidden = false;
  sh.innerHTML = `<div class="box stack"><h2>${id ? "Editar" : "Nova"} forma de pagamento</h2>
    <div class="field"><span class="lbl">Nome</span><input id="fn" value="${esc(f.nome)}"></div>
    <div class="field"><span class="lbl">Tipo</span><select id="ft"><option value="credito" ${f.tipo === "credito" ? "selected" : ""}>Cartão de crédito</option><option value="dinheiro" ${f.tipo !== "credito" ? "selected" : ""}>Pagamento na hora (Pix, boleto, dinheiro, Flash)</option></select></div>
    <div class="grid2" id="fcr" ${f.tipo === "credito" ? "" : "hidden"}><div class="field"><span class="lbl">Fecha dia</span><input id="ff" type="number" inputmode="numeric" value="${esc(f.fecha || "")}"></div><div class="field"><span class="lbl">Vence dia</span><input id="fv" type="number" inputmode="numeric" value="${esc(f.vence || "")}"></div></div>
    <div class="field" id="fdn" ${f.tipo === "credito" ? "hidden" : ""}><span class="lbl">Sempre pago por</span><select id="fdo"><option value="">Quem lançar escolhe</option>${QUEM.map(q => `<option ${q === f.dono ? "selected" : ""}>${q}</option>`).join("")}</select></div>
    <div class="row">${id ? `<button class="danger" id="fx">Excluir</button>` : ""}<button data-x>Cancelar</button><button class="primary" style="flex:1" id="fok">Salvar</button></div></div>`;
  const fechar = () => { sh.hidden = true; sh.innerHTML = ""; render(); };
  sh.querySelector("[data-x]").onclick = fechar; sh.onclick = e => { if (e.target === sh) fechar(); };
  sh.querySelector("#ft").onchange = e => { sh.querySelector("#fcr").hidden = e.target.value !== "credito"; sh.querySelector("#fdn").hidden = e.target.value === "credito"; };
  const del = sh.querySelector("#fx");
  if (del) del.onclick = () => { if (!del.dataset.ok) { del.dataset.ok = 1; del.textContent = "Toque de novo"; return; } S.cfg.formas = S.cfg.formas.filter(x => x.id !== id); salvarCfg(); fechar(); };
  sh.querySelector("#fok").onclick = () => {
    const nome = sh.querySelector("#fn").value.trim(); if (!nome) return toast("Dê um nome");
    const t = sh.querySelector("#ft").value, d = { id: f.id || norm(nome).replace(/[^a-z0-9]/g, "") || novoId(), nome, tipo: t };
    if (t === "credito") { d.fecha = +sh.querySelector("#ff").value || null; d.vence = +sh.querySelector("#fv").value || null; } else if (sh.querySelector("#fdo").value) d.dono = sh.querySelector("#fdo").value;
    S.cfg.formas = f.id ? S.cfg.formas.map(x => x.id === f.id ? d : x) : [...S.cfg.formas, d]; salvarCfg(); toast("Salvo"); fechar();
  };
}
function editarEntrada(id) {
  const e = id ? { ...S.cfg.entradas.find(x => x.id === id) } : { id: "", nome: "", valor: 0, quem: S.eu, casa: false }, sh = $("#sheet"); sh.hidden = false;
  sh.innerHTML = `<div class="box stack"><h2>${id ? "Editar" : "Nova"} entrada fixa</h2>
    <div class="field"><span class="lbl">Nome</span><input id="en" value="${esc(e.nome)}" placeholder="Ex.: Salário Camila"></div>
    <div class="grid2"><div class="field"><span class="lbl">Valor por mês (R$)</span><input id="ev" inputmode="decimal" value="${valorTxt(e.valor)}"></div>
    <div class="field"><span class="lbl">De quem</span><select id="eq">${QUEM.map(q => `<option ${q === e.quem ? "selected" : ""}>${q}</option>`).join("")}</select></div></div>
    <label class="row"><input type="checkbox" id="ec" ${e.casa ? "checked" : ""}> É dinheiro da casa (Vó/Tio): entra no acerto</label>
    <div class="row">${id ? `<button class="danger" id="ex">Excluir</button>` : ""}<button data-x>Cancelar</button><button class="primary" style="flex:1" id="eok">Salvar</button></div></div>`;
  const fechar = () => { sh.hidden = true; sh.innerHTML = ""; render(); };
  sh.querySelector("[data-x]").onclick = fechar; sh.onclick = ev => { if (ev.target === sh) fechar(); };
  const del = sh.querySelector("#ex");
  if (del) del.onclick = () => { if (!del.dataset.ok) { del.dataset.ok = 1; del.textContent = "Toque de novo"; return; } S.cfg.entradas = S.cfg.entradas.filter(x => x.id !== id); salvarCfg(); fechar(); };
  sh.querySelector("#eok").onclick = () => {
    const nome = sh.querySelector("#en").value.trim(); if (!nome) return toast("Dê um nome");
    const d = { id: e.id || novoId(), nome, valor: lerValor(sh.querySelector("#ev").value), quem: sh.querySelector("#eq").value, casa: sh.querySelector("#ec").checked };
    S.cfg.entradas = [...(S.cfg.entradas || []).filter(x => x.id !== d.id), d]; salvarCfg(); toast("Salvo"); fechar();
  };
}

/* ---------- IMPORTAR DO SÛU ---------- */
function converterSuu(raw) {
  const x = JSON.parse(raw); if (!x || x.v !== "suu1") throw new Error("Esses dados não vieram do Exportar do Sûu.");
  const cfg = x.cfg || {};
  const formas = (cfg.contas || []).map(c => c.tipo === "credito" ? { id: c.id, nome: c.nome, tipo: "credito", fecha: c.fechamento, vence: c.vencimento }
    : c.id === "flash" || c.tipo === "beneficio" ? { id: c.id, nome: "Flash", tipo: "dinheiro", dono: "Camila" } : { id: c.id, nome: c.nome, tipo: "dinheiro" });
  if (!formas.some(f => f.id === "dinheiro")) formas.push({ id: "dinheiro", nome: "Dinheiro", tipo: "dinheiro" });
  const fpag = id => formas.some(f => f.id === id) ? id : "pix";
  const categorias = [
    ...(cfg.recorrentes || []).map(r => ({ id: r.id, nome: r.nome, tipo: "Fixa", dia: +r.dia || 1, valor: +r.valor || 0, pagoCom: r.conta ? fpag(r.conta) : "boleto", desde: r.desde || "", ate: r.ate || "" })),
    ...(cfg.listaRec || []).map(n => ({ id: novoId(), nome: n, tipo: "Recorrente" })),
    ...(cfg.categorias || []).map(n => ({ id: novoId(), nome: n, tipo: "Esporádica" }))
  ];
  const vistos = new Set(); const cats = categorias.filter(c => { const k = norm(c.nome); if (vistos.has(k)) return false; vistos.add(k); return true; });
  const casaCom = cfg.casaCom || "Kaike";
  const entradas = (cfg.receitasFixas || []).map(r => { const casa = r.id === cfg.entradaCasa || /casa|vo\/tio/.test(norm(r.nome)); const q = /kaike/.test(norm(r.nome)) ? "Kaike" : /camila/.test(norm(r.nome)) ? "Camila" : casaCom; return { id: r.id, nome: r.nome.replace(" · ", " "), valor: +r.valor || 0, quem: casa ? casaCom : q, casa }; });
  const mov = (x.lanc || []).map(l => {
    const base = { data: l.data, mes: l.mes, valor: r2(l.valor), desc: l.descricao || "", criadoEm: l.criadoEm || Date.now(), criadoPor: l._quem || "" };
    if (l.tipo === "receita") return { id: l.id, ...base, tipo: "entrada", desc: [l.categoria, l.descricao].filter(Boolean).join(" · "), quemRecebeu: QUEM.includes(l._quem) ? l._quem : "Camila" };
    if (l.tipo === "areceber") return { id: l.id, ...base, tipo: "areceber", desc: l.categoria || l.descricao || "", de: l.aReceber?.de || "Alguém", valor: r2(l.aReceber?.valor ?? l.valor), recebido: !!l.aReceber?.recebido };
    const pg = l.conta ? fpag(l.conta) : "boleto";
    const g = { id: l.id, ...base, tipo: "gasto", categoria: l.categoria || "Outros", pagoCom: pg, quemPagou: pg === "flash" ? "Camila" : (QUEM.includes(l._quem) ? l._quem : "Camila"), deQuem: l.resp || "Casa" };
    if (l.parcela) g.parcela = l.parcela;
    if (l.recorrente) { g.fixa = l.recorrente; g.fixaMes = l.mes; }
    if (l.deve) { g.deve = l.deve; g.quitado = !!l.quitado; }
    return g;
  });
  const meses = {};
  Object.entries(x.meses || {}).forEach(([ym, m]) => {
    const o = {};
    if (m.entradas) o.entradas = m.entradas;
    const fats = {}; Object.entries(m.faturas || {}).forEach(([id, f]) => { fats[id] = { pago: true, por: QUEM.includes(f._quem) ? f._quem : (f.pagoPor || "Kaike"), data: f.data || "" }; if (f.valor != null) fats[id].valor = +f.valor; });
    Object.entries(m.faturasValor || {}).forEach(([id, v]) => { fats[id] = { ...(fats[id] || { pago: false }), valor: +v }; });
    if (Object.keys(fats).length) o.faturas = fats;
    if (m.acertoPago) o.acertoPago = m.acertoPago;
    if (Object.keys(o).length) meses[ym] = o;
  });
  const meu = [...Object.entries(x.meu?.docs || {}).map(([id, d]) => ({ id, salario: +d.salario || 0, extras: +d.extras || 0 })), ...(x.meu?.gastos || []).map(g => ({ id: g.id, t: "g", valor: g.valor, descricao: g.descricao || "", categoria: g.categoria || "Outros", data: g.data, criadoEm: g.criadoEm || 0 }))];
  return { cfg: { formas, categorias: cats, entradas, casaCom, limite: 3000, inicio: "" }, mov, meses, meu, dono: x.eu };
}
async function importar(raw, soMeu) {
  let d; try { d = converterSuu(raw.trim()); } catch (e) { return toast("Não consegui ler: " + e.message); }
  const ops = [];
  if (!soMeu) { ops.push([doc(db, "ajustes", "geral"), d.cfg]); d.mov.forEach(m => { const { id, ...r } = m; ops.push([doc(db, "mov", id), r]); }); Object.entries(d.meses).forEach(([ym, m]) => ops.push([doc(db, "meses", ym), m])); }
  if (d.dono === S.eu) d.meu.forEach(m => { const { id, ...r } = m; ops.push([meuDoc(id), r]); });
  try { for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db); ops.slice(i, i + 400).forEach(([ref, v]) => b.set(ref, limpa(v))); await b.commit(); } }
  catch (e) { return falha(e); }
  toast(soMeu ? `Aba Meu importada (${d.meu.length} itens)` : `Importado: ${d.mov.length} lançamentos`);
  if (d.dono !== S.eu) setTimeout(() => toast(`A aba Meu desses dados é da ${d.dono}. Ela precisa importar pelo celular dela.`), 2800);
}

/* ================= AÇÕES ================= */
function ligarTela() {
  const fl = $("#form-lancar"); if (fl) { if (!S.form) S.form = novoForm(); ligarForm(fl, S.form, null); }
  ["meuSal", "meuExt", "meuTxt", "meuCat", "meuData"].forEach(id => { const el = document.getElementById(id); if (!el) return; const k = { meuSal: "sal", meuExt: "ext", meuTxt: "txt", meuCat: "cat", meuData: "data" }[id]; const f = () => S.meuDraft[k] = el.value; el.addEventListener("input", f); el.addEventListener("change", f); });
  const mt = $("#meuTxt"); if (mt) mt.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); acao("meu-add"); } });
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; S.tab = b.dataset.tab; window.scrollTo(0, 0); render(); });
$("#app").addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (b) acao(b.dataset.a, b); });
function acao(a, b = {}) {
  const v = b.dataset?.v, ym = S.mes;
  const f = {
    entrar: () => entrar(),
    sair: () => signOut(auth),
    mes: () => { S.mes = addMonths(S.mes, +v); render(); },
    editar: () => { const m = S.mov.find(x => x.id === v); if (m) editarMov(m); },
    "pagar-fixa": () => { const x = fixasMes(ym).find(x => x.c.id === v); if (!x) return; abrirJanela(novoForm({ categoria: x.c.nome, valor: +x.c.valor || 0, data: x.venc, pagoCom: x.c.pagoCom || "boleto", fixa: x.c.id, fixaMes: ym }), "Pagar " + x.c.nome); },
    "fatura-pagar": () => pagarFatura(v),
    "fatura-desfaz": () => salvarMes(ym, { faturas: { [v]: { pago: false } } }),
    "acerto-pago": () => salvarMes(ym, { acertoPago: { data: today(), de: b.dataset.de, para: b.dataset.para, valor: +b.dataset.valor } }),
    "acerto-desfaz": () => salvarMes(ym, { acertoPago: null }),
    recebi: () => { const m = S.mov.find(x => x.id === v); if (m) { const { id, ...r } = m; salvarMov(id, { ...r, recebido: true, recebidoEm: today() }); toast("Marcado como recebido"); } },
    quitei: () => { const m = S.mov.find(x => x.id === v); if (m) { const { id, ...r } = m; salvarMov(id, { ...r, quitado: true }); } },
    "salvar-entradas": () => { const o = {}; document.querySelectorAll("[data-ent]").forEach(i => o[i.dataset.ent] = lerValor(i.value)); salvarMes(ym, { entradas: o }); toast("Entradas salvas"); },
    "meu-salvar": () => { const sal = lerValor($("#meuSal").value), ext = lerValor($("#meuExt").value); setDoc(meuDoc("m-" + ym), { salario: sal, extras: ext }).then(() => { S.meuDraft = { ym }; toast("Salvo"); }).catch(falha); },
    "meu-add": () => {
      const t = ($("#meuTxt").value || "").trim(), mm = t.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/), val = mm ? lerValor(mm[1]) : 0;
      if (!(val > 0)) return toast("Escreva o valor e o que foi, ex.: 80 blusa");
      setDoc(meuDoc("g-" + novoId()), { t: "g", valor: val, descricao: capital(t.replace(mm[0], " ").replace(/\s+/g, " ").trim()), categoria: $("#meuCat").value, data: $("#meuData").value || today(), criadoEm: Date.now() })
        .then(() => { S.meuDraft.txt = ""; toast("Lançado"); }).catch(falha); S.meuDraft.txt = "";
    },
    "meu-rm": () => deleteDoc(meuDoc(v)).catch(falha),
    "cat-editar": () => editarCategoria(v),
    "cat-nova": () => editarCategoria("", v),
    "forma-editar": () => editarForma(v),
    "ent-editar": () => editarEntrada(v),
    "geral-salvar": () => { S.cfg.inicio = $("#g-ini").value; S.cfg.limite = lerValor($("#g-lim").value) || 3000; S.cfg.casaCom = $("#g-casa").value; salvarCfg(); toast("Salvo"); },
    importar: () => importar($("#imp").value || "", S.cfgOk)
  }[a];
  if (f) f();
}
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
