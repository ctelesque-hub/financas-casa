<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sûu Finance</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sûu">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Identidade SÛU: preto e prata, búfalo ao fundo */
:root{
  --bg:#0a0a0a; --surface:rgba(24,24,24,.78); --sunk:#1f1f1f; --line:#2c2c2c;
  --fg:#ededed; --muted:#9b9b9b; --accent:#c8c8c8; --accent-fg:#0a0a0a; --accent-soft:#262626;
  --good:#6fd39a; --warn:#f2b04b; --bad:#ff8a80; --bad-soft:#3a1c1a;
  --display:"Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wm{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(96vw,580px);opacity:.13;pointer-events:none;z-index:0}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:1}
h1{font-size:30px} h2{font-size:23px}
h3{font-size:15px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.who{font-size:13px;color:var(--muted)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .hint{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--sunk);color:var(--fg);font-weight:600;touch-action:manipulation}
button.primary{background:var(--accent);color:var(--accent-fg)}
button.ghost{background:transparent;padding:6px 8px;color:var(--muted);font-weight:500}
button.danger{background:var(--bad-soft);color:var(--bad)}
button.full{width:100%}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:20px;height:20px;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;padding:7px 10px;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.money{font-weight:700;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)} .warn{color:var(--warn)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .v{font-size:17px;font-weight:700;margin-top:2px}
.kpi.full{grid-column:1/-1}
.list{display:flex;flex-direction:column}
.day{font-size:12px;color:var(--muted);font-weight:600;padding:12px 0 4px}
.tx{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;width:100%;background:none;border-radius:0;text-align:left;font-weight:400;color:var(--fg)}
.tx .d{min-width:0}
.tx .t{font-weight:600;overflow-wrap:anywhere}
.tx .s{font-size:12.5px;color:var(--muted)}
.tx.pago{opacity:.55}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8d8d8d,#e2e2e2);border-radius:99px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.linha{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.linha.forte{font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 0 2px}
.sem{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--accent-soft)}
.sem.warn{background:color-mix(in srgb,var(--warn) 18%,transparent)} .sem.bad{background:var(--bad-soft)}
.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{text-transform:capitalize;text-align:center}
.monthnav button{width:42px;height:42px;font-size:20px;padding:0}
details.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
details.blk>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font-weight:600}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary .nm::before{content:"›";display:inline-block;margin-right:8px;color:var(--muted);transition:transform .15s}
details.blk[open]>summary .nm::before{transform:rotate(90deg)}
details.blk[open]>summary{margin-bottom:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#141414;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
nav.tabs button{background:none;border-radius:0;padding:10px 0 12px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.sheet{position:fixed;inset:0;background:rgb(0 0 0 / .6);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet .box{background:var(--bg);border:1px solid var(--line);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:92vh;overflow:auto}
.entrada{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.entrada img{width:180px;margin:0 auto;opacity:.9}
.graf{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:18px}
.graf .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted);text-transform:capitalize}
.graf .col i{display:block;width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#e2e2e2,#8d8d8d);min-height:2px}
.graf .vl{color:var(--fg);font-weight:600}
details>summary{cursor:pointer}
details:not(.blk)>summary{list-style:none}
details:not(.blk)>summary::-webkit-details-marker{display:none}
.field input.data-curta{font-size:14px;padding:10px 8px;width:140px;min-width:0;-webkit-appearance:none}
.buy{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.buy .ck{flex:1;display:flex;align-items:center;gap:12px;background:none;border-radius:0;padding:11px 0;font-weight:500;font-size:16px;text-align:left;color:var(--muted)}
.buy .ck::before{content:"";width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;flex:none}
.buy.on .ck{color:var(--fg);font-weight:600}
.buy.on .ck::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--bg)}
a.lnk{font-size:13px;padding:6px 10px;border-radius:9px;background:var(--sunk);color:var(--fg);text-decoration:none;font-weight:600}
.data-btn{position:relative;display:block}
.data-btn .data-txt{display:block;padding:9px 12px;border-radius:9px;background:var(--sunk);border:1px solid var(--line);font-size:16px;white-space:nowrap}
.data-btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;-webkit-appearance:none;appearance:none}
</style>
</head>

const fechaData = (f, M) => { const F = fechaDia(f, M); return vencNoMes(+f.vence > F ? M : addMes(M, -1), F); };
// mês em que o lançamento pesa (cartão é recalculado na hora, para respeitar o fechamento do mês)
const mesDe = l => l.es === "saida" && ehCartao(l.forma) ? competencia(l.data, l.forma) : l.mes;
const vencNoMes = (ym, dia) => `${ym}-${pad(Math.min(+dia || 1, diasNoMes(ym)))}`;
const ehEmprestimo = l => l.tipo === "Empréstimo";
const ehRecebimento = l => l.tipo === "Recebimento";

/* ================= CÁLCULOS ================= */
const saidasMes = ym => S.base.filter(l => l.es === "saida" && mesDe(l) === ym);
function fixasMes(ym) {
  if (ym < (S.cfg.inicio || "")) return [];
  return S.cfg.fixas.map(f => ({ f, venc: vencNoMes(ym, f.dia), pago: S.base.find(l => l.fixaId === f.id && l.fixaMes === ym) })).sort((a, b) => a.venc.localeCompare(b.venc));
}
// contas fixas no cartão: entram sozinhas na fatura, pela data de vencimento delas
function fixasNoCartao(f, ym) {
  const out = [];
  for (let k = -2; k <= 0; k++) {
    // Carrefour: a 1ª fatura (dezembro) também leva as cobranças de novembro feitas depois do fechamento
    const ini = S.cfg.inicio || "", m = addMes(ym, k);
    if (m < ini && !(f.id === "carrefour" && m === addMes(ini, -1) && ym >= ini)) continue;
    S.cfg.fixas.filter(x => x.forma === f.id).forEach(x => {
      if (S.base.some(l => l.fixaId === x.id && l.fixaMes === m)) return;
      const d = vencNoMes(m, x.dia); if (competencia(d, f.id) !== ym) return;
      out.push({ id: "", auto: x.id, es: "saida", data: d, tipo: "Fixa", descricao: x.nome, observacao: "automática", forma: f.id, responsavel: x.responsavel || "Casa", pagoPor: f.dono || x.pagoPor || "", valor: +x.valor || 0 });
    });
  }
  return out;
}
function faturasMes(ym) {
  return S.cfg.formas.filter(f => f.cartao).map(f => {
    const itens = [...saidasMes(ym).filter(l => l.forma === f.id), ...fixasNoCartao(f, ym)], total = soma(itens.map(l => l.valor));
    const st = S.mes[ym]?.faturas?.[f.id] || {};
    const valor = st.valor != null ? +st.valor : total;
    const emprestimos = soma(itens.filter(ehEmprestimo).map(l => l.valor));
    return { f, itens, total, valor, emprestimos, venc: vencNoMes(ym, f.vence), fecha: fechaData(f, ym), fechaMudou: st.fecha != null, pago: !!st.pago, pagoPor: st.pagoPor || "", st };
  });
}
function entradasMes(ym) {
  const ov = S.mes[ym]?.entradas || {};
  const fixas = S.cfg.entradas.map(e => ({ ...e, valorMes: ov[e.id] != null ? +ov[e.id] : +e.valor || 0 }));
  const avulsas = S.base.filter(l => l.es === "entrada" && l.mes === ym && !ehRecebimento(l));
  const casa = r2(soma(fixas.filter(e => e.responsavel === "Casa").map(e => e.valorMes)) + soma(avulsas.filter(l => l.responsavel === "Casa").map(l => l.valor)));
  return { fixas, avulsas, casa, total: r2(soma(fixas.map(e => e.valorMes)) + soma(avulsas.map(l => l.valor))) };
}
// Gasto total = avulsos fora do cartão + A Pagar + faturas (empréstimos ficam de fora)
function resumo(ym) {
  const fats = faturasMes(ym), fixas = fixasMes(ym);
  const avulsos = saidasMes(ym).filter(l => !ehCartao(l.forma) && !ehEmprestimo(l) && !l.fixaId);
  const fixasValor = fixas.map(x => x.pago ? (ehCartao(x.pago.forma) ? 0 : x.pago.valor) : ehCartao(x.f.forma) ? 0 : (+x.f.valor || 0));   // fixa no cartão entra pela fatura   // fixa paga no cartão já está na fatura
  const faturasLiq = fats.map(x => r2(x.valor - x.emprestimos));
  const total = r2(soma(avulsos.map(l => l.valor)) + soma(fixasValor) + soma(faturasLiq));
  const ent = entradasMes(ym), casa = ent.casa, casaCom = DUPLA.includes(S.cfg.casaCom) ? S.cfg.casaCom : "Kaike";
  const parte = r2((total - casa) / 2);
  // quem pagou o quê
  const pg = { Camila: [], Kaike: [] }, ajuste = { Camila: 0, Kaike: 0 };
  avulsos.forEach(l => { const q = forma(l.forma).dono || l.pagoPor; if (pg[q]) pg[q].push({ t: l.descricao + (l.observacao ? " · " + l.observacao : ""), d: l.data, v: l.valor }); });
  fixas.forEach(x => { if (x.pago && !ehCartao(x.pago.forma)) { const q = forma(x.pago.forma).dono || x.pago.pagoPor; if (pg[q]) pg[q].push({ t: x.f.nome, d: x.pago.data, v: x.pago.valor }); } });
  fats.forEach(x => {
    if (!x.pago || !pg[x.pagoPor]) return;
    pg[x.pagoPor].push({ t: "Fatura " + x.f.nome + (x.emprestimos ? " (sem os empréstimos)" : ""), d: x.st.data || x.venc, v: r2(x.valor - x.emprestimos) });
    // empréstimo feito no cartão: quem pagou a fatura bancou o empréstimo de quem emprestou
    x.itens.filter(ehEmprestimo).forEach(l => { const quem = l.pagoPor; if (DUPLA.includes(quem) && quem !== x.pagoPor) { ajuste[x.pagoPor] += l.valor; ajuste[quem] -= l.valor; } });
  });
  const pago = { Camila: soma(pg.Camila.map(p => p.v)), Kaike: soma(pg.Kaike.map(p => p.v)) };
  const aberto = r2(total - pago.Camila - pago.Kaike);
  const saldo = {};
  DUPLA.forEach(q => saldo[q] = r2(pago[q] - parte - (q === casaCom ? casa : 0) + ajuste[q]));
  const outro = DUPLA.find(q => q !== casaCom);
  let msg, cls = "";
  const s = saldo.Camila;
  if (Math.abs(s) < 0.5) msg = "Ninguém deve ninguém.";
  else if (s > 0) { msg = `<strong>Kaike deve ${fmt(s)} para Camila.</strong>`; cls = "warn"; }
  else { msg = `<strong>Camila deve ${fmt(-s)} para Kaike.</strong>`; cls = "warn"; }
  return { fats, fixas, avulsos, total, ent, casa, casaCom, outro, parte, pg, pago, ajuste, aberto, parcial: aberto > 0.5, saldo, msg, cls };
}
function recebiveis() {
  const p = {};
  S.base.filter(ehEmprestimo).forEach(l => { const k = l.responsavel; (p[k] = p[k] || { emp: 0, rec: 0, itens: [] }); p[k].emp += l.valor; p[k].itens.push(l); });
  S.base.filter(l => ehRecebimento(l) && l.es === "entrada").forEach(l => { const k = l.pagoPor; (p[k] = p[k] || { emp: 0, rec: 0, itens: [] }); p[k].rec += l.valor; p[k].itens.push(l); });
  return Object.entries(p).map(([nome, x]) => ({ nome, emp: r2(x.emp), rec: r2(x.rec), aberto: r2(x.emp - x.rec), itens: x.itens.sort((a, b) => b.data.localeCompare(a.data)) })).sort((a, b) => b.aberto - a.aberto);
}

}

function salvar(F) {
  if (!(F.valor > 0)) { toast("Digite o valor"); return false; }
  if (!F.descricao) { toast("Escolha a descrição"); return false; }
  const data = F.data || hoje(), dono = forma(F.forma).dono;
  const l = { es: F.es, data, tipo: F.tipo, descricao: F.descricao, observacao: (F.observacao || "").trim(), forma: F.forma, responsavel: F.responsavel, pagoPor: dono || F.pagoPor, valor: r2(F.valor), criadoPor: F.criadoPor || S.eu, criadoEm: F.criadoEm || Date.now() };
  if (F.fixaId) { l.fixaId = F.fixaId; l.fixaMes = F.fixaMes; }
  if (F.editId) { if (F.parcela) l.parcela = F.parcela; l.mes = F.es === "saida" ? competencia(data, F.forma) : mesCasa(data); salvarLanc(F.editId, l); toast("Atualizado"); return true; }
  if (F.tipo === "Parcela" && F.parcelas > 1 && F.es === "saida") {
    const n = F.parcelas, g = novoId(), vp = Math.floor(F.valor / n * 100) / 100;
    for (let i = 0; i < n; i++) {

      salvarLanc(novoId(), { ...l, data: di, mes: competencia(di, F.forma), valor: i === n - 1 ? r2(F.valor - vp * (n - 1)) : vp, parcela: { n: i + 1, total: n, grupo: g, valorTotal: r2(F.valor) } });
    }

}

const MEU_CATS = ["Roupas", "Beleza", "Saúde", "Academia", "Lazer", "Comida fora", "Presentes", "Assinaturas", "Educação", "Outros"];
function meuMes(ym) {
  const d = S.meu.docs["m-" + ym]; if (d) return { salario: +d.salario || 0, extras: +d.extras || 0, salvo: true };
  const ant = Object.keys(S.meu.docs).filter(k => k.startsWith("m-") && k.slice(2) < ym).sort().pop();
  return { salario: ant ? +S.meu.docs[ant].salario || 0 : 0, extras: 0, salvo: false, herdado: !!ant };
}
function vMeu() {
  const ym = S.ym, m = meuMes(ym), R = resumo(ym), eu = S.eu, ent = r2(m.salario + m.extras);
  const minhaParte = R.parte;
  // quem guarda o dinheiro da casa paga parte das contas com ele: só o que passar disso sai do próprio bolso
  const jaPaguei = eu === R.casaCom ? Math.max(0, r2((R.pago[eu] || 0) - R.casa)) : (R.pago[eu] || 0), falta = Math.max(0, r2(minhaParte - jaPaguei));
  const gs = S.meu.gastos.filter(g => mesCasa(g.data) === ym).sort((a, b) => b.data.localeCompare(a.data)), totG = soma(gs.map(g => g.valor));
  const sobraProj = r2(ent - minhaParte - totG), sobraReal = r2(ent - jaPaguei - totG);
  const cor = v => v < 0 ? "neg" : "pos";
  return `<div class="stack"><button class="ghost" data-tela-ir="ajustes" style="align-self:flex-start">‹ Ajustes</button>${navMes()}
    <div class="kpis"><div class="kpi"><div class="lbl">Minhas entradas</div><div class="v">${fmt(ent)}</div></div><div class="kpi"><div class="lbl">Minha parte da casa</div><div class="v">${fmt(minhaParte)}</div></div>
      <div class="kpi"><div class="lbl">Sobra real (conta)</div><div class="v ${cor(sobraReal)}">${fmt(sobraReal)}</div></div><div class="kpi"><div class="lbl">Sobra projetada</div><div class="v ${cor(sobraProj)}">${fmt(sobraProj)}</div></div></div>
    <div class="panel stack"><h3>Minhas entradas de ${nomeMes(ym)}</h3>
      <div class="grid2"><div class="field"><span class="lbl">Salário (R$)</span><input id="meuSal" inputmode="decimal" value="${vTxt(m.salario)}"></div><div class="field"><span class="lbl">Extras (R$)</span><input id="meuExt" inputmode="decimal" value="${vTxt(m.extras)}"></div></div>
      ${!m.salvo && m.herdado ? `<p class="hint">Repetido do mês anterior. Toque em Salvar para confirmar.</p>` : ""}<button class="primary" data-a="meu-salvar">Salvar</button></div>
    <div class="panel"><h3>Minha parte da casa</h3>${linha("Parte de cada um", fmt(minhaParte))}${linha("Já paguei", fmt(jaPaguei))}${linha("<strong>Ainda vou colocar na casa</strong>", `<span class="warn">${fmt(falta)}</span>`)}
      ${eu === R.casaCom ? `<p class="hint">Você também guarda ${fmt(R.casa)} do dinheiro da casa, que paga parte das contas.</p>` : ""}</div>
    <div class="panel stack"><div class="row between"><h3>Meus gastos</h3><span class="money">${fmt(totG)}</span></div>
      <div class="grid2"><div class="field"><span class="lbl">Valor e o que foi</span><input id="meuTxt" placeholder="80 blusa" autocomplete="off"></div><div class="field"><span class="lbl">Categoria</span><select id="meuCat">${opcoes(MEU_CATS, "Outros")}</select></div></div>
      <div class="grid2" style="grid-template-columns:1fr auto;align-items:end"><div class="field"><span class="lbl">Data</span><input id="meuData" type="date" value="${hoje()}"></div><button class="primary" data-a="meu-add">Lançar</button></div>
      <div class="list">${gs.length ? gs.map(g => `<div class="tx"><span class="d"><span class="t">${esc(g.descricao || g.categoria)}</span><br><span class="s">${dm(g.data)} · ${esc(g.categoria)}</span></span><span class="row"><span class="money">${fmt(g.valor)}</span><button class="ghost" data-a="meu-rm" data-v="${esc(g.id)}">Remover</button></span></div>`).join("") : `<div class="empty">Nenhum gasto pessoal neste mês.</div>`}</div></div>
    <p class="hint" style="text-align:center">Só você vê a Minha área.</p></div>`;
}

  const grupos = [...GR_WISH, ...new Set(S.wishlist.map(x => x.grupo).filter(g => !GR_WISH.includes(g)))];
  janela(id ? "Editar desejo" : "Novo desejo", `<div class="stack">
    <div class="field"><span class="lbl">Nome</span><input id="wn" value="${esc(w.nome)}"></div>
    <div class="field"><span class="lbl">Cômodo</span><select id="wg">${opcoes(grupos, w.grupo)}</select></div>
    <div class="field"><span class="lbl">Detalhe</span><input id="wd" value="${esc(w.descricao)}" placeholder="Modelo, cor…"></div>
    <div class="field"><span class="lbl">Link</span><input id="wl" value="${esc(w.link)}" placeholder="https://"></div>
    <div class="grid2"><div class="field"><span class="lbl">Preço à vista (R$)</span><input id="wv" inputmode="decimal" value="${vTxt(w.valor)}"></div>
      <div class="field"><span class="lbl">Parcelas</span><input id="wp" type="number" inputmode="numeric" value="${w.parcelas || ""}"></div></div>
    <div class="field"><span class="lbl">Valor da parcela (R$)</span><input id="wvp" inputmode="decimal" value="${vTxt(w.valorParcela)}"></div>
    <div class="row">${id ? `<button class="danger" id="wx">Excluir</button>` : ""}<button class="primary" style="flex:1" id="wok">Salvar</button></div></div>`, (box, fechar) => {
    const del = box.querySelector("#wx");
    if (del) del.onclick = () => { if (!del.dataset.ok) { del.dataset.ok = 1; del.textContent = "Toque de novo"; return; } deleteDoc(doc(db, "wishlist", id)).catch(falha); fechar(); };
    box.querySelector("#wok").onclick = () => {
      const nome = box.querySelector("#wn").value.trim(); if (!nome) return toast("Dê um nome");
      const d = { ...limpaId(w), nome, grupo: box.querySelector("#wg").value, descricao: box.querySelector("#wd").value.trim(), link: box.querySelector("#wl").value.trim(), valor: lerValor(box.querySelector("#wv").value), parcelas: +box.querySelector("#wp").value || 0, valorParcela: lerValor(box.querySelector("#wvp").value), comprado: !!w.comprado, criadoEm: w.criadoEm || Date.now() };
      setDoc(doc(db, "wishlist", id || novoId()), limpa(d)).catch(falha); toast("Salvo"); fechar();
    };
  });
}

/* ================= AÇÕES ================= */
function depois() {
  const fl = $("#form-lancar"); if (fl) { if (!S.form) S.form = novoForm(); ligarForm(fl, S.form, null); }
  const mt = $("#meuTxt"); if (mt) mt.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); acao("meu-add"); } });
}
$("#app").addEventListener("toggle", e => { const d = e.target; if (d.matches && d.matches("details[data-k]")) { d.open ? S.abertos.add(d.dataset.k) : S.abertos.delete(d.dataset.k); } }, true);
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tela]"); if (!b) return; S.tela = b.dataset.tela; scrollTo(0, 0); render(); });
$("#app").addEventListener("click", e => {
  const t = e.target.closest("[data-tela-ir]"); if (t) { S.tela = t.dataset.telaIr; scrollTo(0, 0); return render(); }
  const b = e.target.closest("[data-a]"); if (b) acao(b.dataset.a, b);
});
function acao(a, b = { dataset: {} }) {
  const v = b.dataset.v, k = b.dataset.k, ym = S.ym;
  const f = {
    entrar, sair: () => signOut(auth),
    mes: () => { S.ym = addMes(S.ym, +v); render(); },
    editar: () => { const l = S.base.find(x => x.id === v); if (l) editarLanc(l); },
    pagar: () => { const x = fixasMes(ym).find(x => x.f.id === v); if (!x) return; abrirForm(novoForm({ tipo: "Fixa", descricao: x.f.descricao, observacao: x.f.nome, valor: +x.f.valor || 0, data: x.venc, forma: x.f.forma, responsavel: x.f.responsavel || "Casa", pagoPor: x.f.pagoPor || S.eu, fixaId: x.f.id, fixaMes: ym }), "Pagar " + x.f.nome); },
    "fixa-nova": () => editarFixa(""),
    "fixas-editar": () => listaFixas(),
    "lancar-rec": () => abrirForm(novoForm({ tipo: "Recorrente", descricao: v, data: ym === mesCasa(hoje()) ? hoje() : `${ym}-01` }), "Lançar " + v),
    "fatura-editar": () => editarFatura(v, false),
    "fatura-pagar": () => editarFatura(v, true),
    "fatura-fecha": () => editarFechamento(v),
    "fixa-ver": () => editarFixa(v),
    "lista-ed": () => editarItemLista(k, +v),
    "fatura-desfaz": () => salvarMesDoc(ym, { faturas: { [v]: { pago: false, pagoPor: null, data: null } } }),
    "entradas-salvar": () => { const o = {}; document.querySelectorAll("[data-ent]").forEach(i => o[i.dataset.ent] = lerValor(i.value)); salvarMesDoc(ym, { entradas: o }); toast("Entradas salvas"); },
    "lista-add": () => {
      const inp = $("#add-" + k), val = inp.value.trim(); if (!val) return toast("Escreva o item");
      if (k === "descricoes") { if (S.cfg.descricoes.some(d => norm(d.nome) === norm(val))) return toast("Já existe"); S.cfg.descricoes.push({ nome: val, tipo: $("#add-descricoes-tipo").value }); }
      else { if (S.cfg[k].some(x => norm(x) === norm(val))) return toast("Já existe"); S.cfg[k].push(val); }
      inp.value = ""; salvarCfg(); toast("Adicionado");
    },
    "lista-rm": () => {
      if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = "Confirmar"; return; }
      if (travado(k, +v)) return toast("Esse é usado pelo app"); S.cfg[k].splice(+v, 1); salvarCfg(); toast("Removido");
    },
    "forma-editar": () => editarForma(v),
    "entrada-editar": () => editarEntrada(v),
    "geral-salvar": () => { S.cfg.inicio = $("#g-ini").value; S.cfg.casaCom = $("#g-casa").value; salvarCfg(); toast("Salvo"); },
    "ir-meu": () => { S.tela = "meu"; scrollTo(0, 0); render(); },
    "ir-mercado": () => { semear("mercado"); S.tela = "mercado"; scrollTo(0, 0); render(); },
    "ir-wishlist": () => { semear("wishlist"); S.tela = "wishlist"; scrollTo(0, 0); render(); },
    "m-tog": () => { const i = S.mercado.find(x => x.id === v); if (i) setDoc(doc(db, "mercado", v), { ...limpaId(i), comprar: !i.comprar }).catch(falha); },
    "m-rm": () => { if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = "Confirmar"; return; } deleteDoc(doc(db, "mercado", v)).catch(falha); },
    "m-add": () => { const n = $("#m-nome").value.trim(); if (!n) return toast("Escreva o item"); if (S.mercado.some(x => norm(x.nome) === norm(n))) return toast("Já está na lista"); setDoc(doc(db, "mercado", novoId()), { nome: n, grupo: $("#m-grupo").value, comprar: true, criadoEm: Date.now() }).catch(falha); $("#m-nome").value = ""; },
    "m-comprei": () => { if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = "Toque de novo"; return; } S.mercado.filter(x => x.comprar).forEach(x => setDoc(doc(db, "mercado", x.id), { ...limpaId(x), comprar: false }).catch(falha)); toast("Lista zerada"); },
    "m-falta": () => { S.soFalta = !S.soFalta; render(); },
    "w-editar": () => editarDesejo(v),
    "w-tog": () => { const i = S.wishlist.find(x => x.id === v); if (i) setDoc(doc(db, "wishlist", v), { ...limpaId(i), comprado: !i.comprado, compradoEm: !i.comprado ? hoje() : null }).catch(falha); },
    "meu-salvar": () => setDoc(meuRef("m-" + ym), { salario: lerValor($("#meuSal").value), extras: lerValor($("#meuExt").value) }).then(() => toast("Salvo")).catch(falha),
    "meu-add": () => {
      const t = ($("#meuTxt").value || "").trim(), mm = t.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/), val = mm ? lerValor(mm[1]) : 0;
      if (!(val > 0)) return toast("Escreva o valor e o que foi, ex.: 80 blusa");
      const desc = t.replace(mm[0], " ").replace(/\s+/g, " ").trim();
      setDoc(meuRef("g-" + novoId()), { t: "g", valor: val, descricao: desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : "", categoria: $("#meuCat").value, data: $("#meuData").value || hoje(), criadoEm: Date.now() }).then(() => toast("Lançado")).catch(falha);
      $("#meuTxt").value = "";
    },
    "meu-rm": () => deleteDoc(meuRef(v)).catch(falha)
  }[a];
  if (f) f();
}
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

</script>
</body>
</html>
